# The Odoo adapter: turns a tenant's Odoo into tools for programs that act for
# a person -- Fellwort's agents, and coding agents through the MCP gateway.
# An MCP server at odoo-adapter:8765/mcp whose tools are the tool packs in its
# chart (services/odoo-adapter/chart/packs), one per Odoo module.
#
# It holds no credential of Odoo. Each call carries one, which goes on to
# Odoo's JSON-2 API with the calls the tool makes, so Odoo decides what the
# call may see and change, by the rights of the person it was issued for.
# As an adapter it reaches odoo-base-ce and nothing else in the tenant, and
# only the tenant's components that speak as a person reach it.
#
# It comes with Fellwort: the store lists it on Odoo's page, and only a
# tenant holding fellwort-ee may acquire or pull it (services/store,
# STORE_ADAPTERS_REQUIRE). The chart and image are private packages of
# ghcr.io/aluvian-hq, pulled through registry.aluvian.io with the credential
# the store minted at acquisition.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: odoo-adapter-ee
  labels:
    gentianos.io/profile-name: odoo-adapter-ee
    gentianos.io/profile-edition: ee
spec:
  classes: [adapter]
  # Nobody opens it: agents call it.
  launch: none
  trustTier: certified
  version: "0.1.0-main.95f4fe1"
  requires:
    platform: ">=0.5"
  adapter:
    adapts:
      profile: odoo-base-ce
      versions: ["0.5.1"]
  package:
    chart:
      repository: "oci://registry.aluvian.io/aluvian-hq/charts"
      name: odoo-adapter
      version: "0.1.0-main.95f4fe1"
    extraValues:
      # The Service callers reach the adapter at.
      fullnameOverride: odoo-adapter
      # The chart's own image, through the registry; its tag stays the
      # chart's, which names the build it was packaged from.
      image:
        repository: registry.aluvian.io/aluvian-hq/odoo-adapter
      # odoo-base-ce's Service, in the same namespace.
      odooUrl: http://odoo:8069
