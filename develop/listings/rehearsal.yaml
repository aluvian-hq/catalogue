description: >-
  Rehearses a Gentian OS release. It makes a throwaway cluster at a cloud
  provider, installs a release on it, upgrades it to another, checks both
  with a tenant, a person and an app, and removes the cluster again. A
  process runs it step after step; each step is one phase. It makes billed
  resources in the cloud account whose credentials the tenant's
  administrator sets for it.
